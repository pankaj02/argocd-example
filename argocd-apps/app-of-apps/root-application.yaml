apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: argocd-apps/app-of-apps/apps
    repoURL: "https://github.com/pankaj02/argocd-example.git"
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
