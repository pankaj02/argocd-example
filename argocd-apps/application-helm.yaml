apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-catalog-helm
  namespace: argocd
spec:
  destination:
    namespace: product-catalog-helm
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: product-catalog/helm/product-catalog
    repoURL: "https://github.com/pankaj02/argocd-example.git"
    targetRevision: main
    helm:
      releaseName: product-catalog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
